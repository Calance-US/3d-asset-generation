<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>3D Scene Generator</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f5f7fa;
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      color: #2c3e50;
      margin-bottom: 1rem;
    }

    form {
      background: #ffffff;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    label {
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    select, textarea, button {
      font-size: 1rem;
      padding: 0.75rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      width: 100%;
      box-sizing: border-box;
    }

    button {
      background-color: #3498db;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background-color: #2980b9;
    }

    #output {
      margin-top: 2rem;
      width: 100%;
      max-width: 900px;
      height: 600px;
      border: 1px solid #ccc;
      border-radius: 8px;
      overflow: hidden;
      background: white;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <h1>Interactive 3D Scene Generator</h1>

  <form id="prompt-form">
    <div>
      <label for="model">Select Model Provider:</label>
      <select id="model" name="model" required>
        <option value="openai">OpenAI</option>
        <option value="anthropic">Anthropic</option>
        <option value="ollama">Ollama</option>
      </select>
    </div>

    <div>
      <label for="prompt">Enter Your Prompt:</label>
      <textarea id="prompt" name="prompt" rows="5" placeholder="e.g., Design a circuit with a battery, a resistor, and a switch. Show current flow when switch is turned on." required></textarea>
    </div>

    <button type="submit">Generate 3D Scene</button>
  </form>

  <div id="output">
    <iframe id="scene-frame"></iframe>
  </div>

  <script>
    const form = document.getElementById("prompt-form");
    const promptInput = document.getElementById("prompt");
    const modelInput = document.getElementById("model");
    const iframe = document.getElementById("scene-frame");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const prompt = promptInput.value.trim();
      const model = modelInput.value;

      if (!prompt) return;

      try {
        const response = await fetch("http://localhost:8000/generate", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ prompt, model })
        });

        const data = await response.json();
        iframe.srcdoc = data.html;
      } catch (err) {
        iframe.srcdoc = `<p style="color:red; padding:1rem;">Error generating scene. Please check backend.</p>`;
        console.error(err);
      }
    });
  </script>
</body>
</html>
