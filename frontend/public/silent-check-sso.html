<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Silent Check SSO</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1f2937;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .loading-container {
            text-align: center;
            max-width: 300px;
            padding: 20px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #374151;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 14px;
            color: #9ca3af;
            margin-bottom: 10px;
        }

        .loading-subtitle {
            font-size: 12px;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="spinner"></div>
        <div class="loading-text">Checking authentication status...</div>
        <div class="loading-subtitle">Please wait</div>
    </div>

    <script>
        /**
         * Silent Check SSO Handler
         *
         * This file is used by Keycloak for silent authentication checks.
         * It runs in an iframe and communicates with the parent window
         * to handle SSO authentication without user interaction.
         */

        try {
            // Extract the fragment parameters from the URL
            const fragment = window.location.hash.substring(1);
            const params = new URLSearchParams(fragment);

            // Check if we have authentication parameters
            const code = params.get('code');
            const state = params.get('state');
            const error = params.get('error');
            const errorDescription = params.get('error_description');

            // Create result object
            const result = {
                code: code,
                state: state,
                error: error,
                errorDescription: errorDescription,
                fragment: fragment
            };

            // Log for debugging (only in development)
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                console.log('Silent SSO check result:', result);
            }

            // Send result to parent window
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    type: 'keycloak-silent-check-sso',
                    result: result
                }, window.location.origin);
            }

            // Also try with the opener if available (fallback)
            if (window.opener && window.opener !== window) {
                window.opener.postMessage({
                    type: 'keycloak-silent-check-sso',
                    result: result
                }, window.location.origin);
            }

        } catch (error) {
            console.error('Error in silent check SSO:', error);

            // Send error to parent window
            const errorResult = {
                error: 'silent_check_sso_error',
                errorDescription: error.message || 'Unknown error occurred during silent SSO check'
            };

            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    type: 'keycloak-silent-check-sso',
                    result: errorResult
                }, window.location.origin);
            }

            if (window.opener && window.opener !== window) {
                window.opener.postMessage({
                    type: 'keycloak-silent-check-sso',
                    result: errorResult
                }, window.location.origin);
            }
        }

        // Auto-close after a timeout to prevent hanging
        setTimeout(function() {
            try {
                window.close();
            } catch (e) {
                // Window might not be closeable, that's okay
            }
        }, 5000);
    </script>
</body>
</html>
