[project]
name = "3d-webapp-backend"
version = "0.1.0"
description = "Backend for 3D educational visualization platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn==0.24.0",
    "pydantic==2.4.2",
    "python-dotenv==1.0.0",
    "openai>=1.6.1,<2.0.0",
    "google-generativeai==0.3.1",
    "redis==5.0.1",
    "boto3==1.28.64",
    "aiohttp==3.9.1",
    "numpy==1.24.3",
    "sentence-transformers==2.2.2",
    "huggingface_hub==0.16.4",
    "pydantic-settings==2.1.0",
    "sqlalchemy==2.0.23",
    "faiss-cpu==1.7.4",
    "python-json-logger==2.0.7",
    "beautifulsoup4==4.12.2",
    "alembic==1.13.1",
    "python-multipart==0.0.6"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.pip]
python = "3.11" 