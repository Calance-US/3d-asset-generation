# === SonarQube Project Properties Example ===

# Unique key for your project in SonarQube.
sonar.projectKey=3d-webapp

# Display name for your project in the SonarQube UI.
sonar.projectName=3d-webapp

# SonarQube server URL (default is http://localhost:9000 for local setup).
sonar.host.url=http://localhost:9000

# Authentication token for analysis. 
# Replace with your actual token or use the SONAR_TOKEN environment variable.
# sonar.login=your_actual_token_here     # Deprecated, prefer 'sonar.token'
# sonar.token=your_actual_token_here     # Uncomment and use this instead.

# Path to your source code (relative to this file). E.g., 'app', 'src', or '.' for current dir.
sonar.sources=app

# Specify Python version used in your project (optional but recommended).
sonar.python.version=3.11

# Exclude files and folders from analysis (comma-separated).
# Example: tests, Markdown files, and migrations directory.
sonar.exclusions=**/tests/**,**/*.md,**/migrations/**

# === Optional: Add test coverage report if you use coverage.py ===
# sonar.python.coverage.reportPaths=coverage.xml
